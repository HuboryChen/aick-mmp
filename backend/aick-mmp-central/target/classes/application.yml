server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
  http2:
    enabled: true

spring:
  application:
    name: mmp-central-server

  profiles:
    active: central,test  # 激活 test profile

  logging:
    level:
      root: INFO
      com.aick.mmp.central: DEBUG
      com.aick.mmp.shared: DEBUG
      org.springframework.security: TRACE
      org.springframework.web: DEBUG

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aick_mmp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
    username: ${SPRING_DATASOURCE_USERNAME:aickuser}
    password: ${SPRING_DATASOURCE_PASSWORD:aickpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      client-config:
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
            max-wait: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mmp-video-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.aick.mmp.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:noreply@aick-mmp.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  websocket:
    enabled: true
  messaging:
    broker:
      endpoints:
        - /ws/alerts
        - /ws/stream

  task:
    scheduling:
      enabled: true
      pool:
        size: 4

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Janus WebRTC Gateway Configuration
janus:
  server-url: ${JANUS_SERVER_URL:http://localhost:8088/janus}
  api-key: ${JANUS_API_KEY:}
  connect-timeout: 10000
  read-timeout: 30000
  ice-servers:
    stun: stun:stun.l.google.com:19302
  rtsp-plugin:
    enabled: true
    video-codec: h264
    audio-codec: opus
    video-port-range: 20000-40000
    audio-port-range: 20000-40000

# WebSocket Configuration
# (已合并到 spring.websocket 节点)

# Scheduling Configuration
# (已合并到 spring.task.scheduling 节点)

# Alert Configuration
alert:
  check:
    interval: 60000  # 告警检查间隔（毫秒）
    enabled: true
  notification:
    enabled: true
    websocket-destination: /topic/alerts

# WebRTC Configuration
webrtc:
  config:
    janus:
      server-url: ${JANUS_SERVER_URL:http://localhost:8088/janus}
      timeout: 5000
    kurento:
      server-url: ${KURENTO_SERVER_URL:wss://localhost:8443/kurento}
    ice-servers:
      - urls: stun:stun.l.google.com:19302
      - urls: stun:stun1.l.google.com:19302

# Video Stream Configuration
video:
  max-resolution: 1920x1080
  default-resolution: 1280x720
  supported-resolutions:
    - 640x480
    - 1280x720
    - 1920x1080
  frame-rate: 25
  bitrate:
    min: 512
    max: 4096
    default: 2048

# Security Configuration
security:
  jwt:
    # IMPORTANT: Change this secret key in production environment!
    # Key generated at: 2025-05-13T15:30:00+08:00
    # Recommended: Use a strong key with at least 256 bits (32 bytes)
    secret: ${JWT_SECRET:mmp-secret-key-change-in-production-environment-which-is-very-long-and-secure}
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days in milliseconds
  encryption:
    # AES-256 encryption key for securing API secret keys
    # IMPORTANT: Must be at least 32 characters in production!
    secret-key: ${ENCRYPTION_SECRET_KEY:mmp-encryption-key-change-in-production}
  allowed-origins: ${SECURITY_ALLOWED_ORIGINS:*}  # Comma-separated list of allowed origins

# Authentication Configuration
auth:
  login:
    max-failed-attempts: 5  # Maximum number of failed login attempts
    lock-duration-minutes: 10  # Account lock duration in minutes after max failed attempts
  session:
    timeout-minutes: 30  # Session timeout in minutes of inactivity

# Edge Node Configuration
edge-node:
  buffer-size: 10
  reconnect-interval: 5000
  max-reconnect-attempts: 10
  local-storage-path: ${EDGE_STORAGE_PATH:/var/local/mmp/edge-storage}
  region-bonus-rate: 0.3
  cpu-threshold: 80.0
  memory-threshold: 85.0

# Edge Node Failover Configuration
# 边缘节点故障转移配置：当节点离线时自动迁移摄像头到其他健康节点
edge:
  failover:
    enabled: true                    # 是否启用自动故障转移
    mode: async                      # 触发模式: sync（同步）或 async（异步）
    delay-seconds: 0                 # 延迟等待秒数（0=立即执行）
    max-concurrent-tasks: 3          # 最大并发转移任务数
    batch-size: 20                   # 每批处理的摄像头数量
    batch-delay-ms: 1000             # 批次间延迟毫秒数
    region-bonus: 0.3                # 同区域节点评分加成比例 (0.0-1.0)
    retry-interval-seconds: 300      # 待分配池重试间隔秒数

# Notification Configuration
notification:
  email:
    enabled: false
    from: noreply@aick-mmp.com
    recipients: admin@aick-mmp.com
  sms:
    enabled: false
    api-url: http://sms-api.example.com/send
    api-key: your-sms-api-key
  webhook:
    enabled: false
    url: http://webhook.example.com/alerts
    secret: your-webhook-secret
  recording:
    enabled: true
    topic: mmp-recording-commands

# Recording Storage Configuration
recording:
  storage:
    # 本地存储根路径
    local-path: ${RECORDING_STORAGE_PATH:/data/recordings}
    # 录像保留天数
    retention-days: 30
    # 磁盘使用率阈值 (达到此值时触发清理)
    disk-usage-threshold: 0.8
    # 清理后保留比例
    cleanup-retention-ratio: 0.7
    # 存储路径模板
    path-template: "{localPath}/{date}/"
    # 文件名模板
    file-name-template: "cam_{cameraId}.mp4"
    # 下载最大并发数
    max-download-concurrency: 3
    # 下载最大带宽 (MB/s)
    max-download-bandwidth-mb: 10
  cleanup:
    # 清理执行时间 (CRON表达式，凌晨2点执行)
    cron: "0 0 2 * * ?"
    # 是否启用自动清理
    enabled: true

# 摄像头配置模板
camera-config-templates:
  preset-templates-path: "classpath:templates/preset-cameras.json"

# 摄像头自动分配配置
camera:
  assignment:
    region-bonus: 0.3              # 同地区节点评分加成比例 (0.0-1.0)
    max-cpu-load: 90.0             # 排除节点的CPU负载阈值 (%)
    capacity-buffer: 0.1           # 节点容量保留余量比例 (0.0-1.0)

# 网络扫描
camera-discovery:
  scan-batch-size: 50
  scan-timeout-ms: 2000
  common-ports: [554, 80, 8080, 8554]

# 批量导入
camera-batch-import:
  batch-size: 50
  batch-delay-ms: 100
  max-file-size-mb: 10