spring:
  application:
    name: aick-mmp-central-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  h2:
    console:
      enabled: true

  # Disable Kafka for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration

# Server configuration
server:
  port: 0  # Random port for tests

# Security configuration
security:
  jwt:
    secret: test-jwt-secret-key-for-integration-testing-only-minimum-256-bits-required
    expiration: 86400000

  encryption:
    key: test-encryption-key-32bytes!!!
    camera-credential-key: test-camera-key-32bytes!!!!

  signature:
    timestamp-tolerance-seconds: 300

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
