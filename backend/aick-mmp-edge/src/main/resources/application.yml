# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: aick-mmp-edge-node
  
# Edge node specific configuration
edge:
  nodeId: ${NODE_ID:edge-node-1}
  region: ${REGION:default-region}
  centralServerUrl: ${CENTRAL_SERVER_URL:http://central-lb}
  heartbeatInterval: ${HEARTBEAT_INTERVAL:30}
  maxConcurrentStreams: ${MAX_CONCURRENT_STREAMS:10}
  registryServer: ${REGISTRY_SERVER:http://central-lb/api/registry}
  
  networkMonitoring:
    intervalSeconds: ${NETWORK_MONITORING_INTERVAL:60}
    cpuThreshold: ${CPU_THRESHOLD:80.0}
    memoryThreshold: ${MEMORY_THRESHOLD:85.0}
    bandwidthThreshold: ${BANDWIDTH_THRESHOLD:80.0}

  # 流重连配置
  stream:
    reconnect:
      enabled: ${STREAM_RECONNECT_ENABLED:true}
      max-retries: ${STREAM_RECONNECT_MAX_RETRIES:3}
      retry-interval-seconds: ${STREAM_RECONNECT_RETRY_INTERVAL:60}

# Minimal logging
logging:
  level:
    com.aick.mmp.edge: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"

# Optional H2 database for local caching
spring.datasource:
  url: jdbc:h2:mem:edge_cache
  driver-class-name: org.h2.Driver
  username: sa
  password: 
  
spring.jpa:
  hibernate:
    ddl-auto: create-drop
  show-sql: false
  database-platform: org.hibernate.dialect.H2Dialect

# H2 Console (for development)
spring.h2.console:
  enabled: true
  path: /h2-console

# Management endpoints (minimal)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 安全配置
# ---------------------------------
# 注意：以下安全配置中的敏感信息建议通过环境变量注入，避免在生产环境中直接明文配置

security:
  # 加密密钥配置
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:mmp-encryption-key-change-in-prod}

  # JWT安全令牌配置
  jwt:
    # 密钥配置：建议使用环境变量(JWT_SECRET)注入，如未设置则使用默认值
    # 注意：默认值仅用于开发环境，生产环境必须设置强密钥
    secret: ${JWT_SECRET:mmp-secret-key-change-in-production-environment-which-is-very-long-and-secure}

    # 令牌过期时间：单位为毫秒，默认为24小时(86400000ms)
    expiration: ${JWT_EXPIRATION:86400000}

# API Key 认证配置 (AK/SK)
api-key:
  # Access Key - 从环境变量注入
  access-key: ${EDGE_ACCESS_KEY:}
  # Secret Key - 从环境变量注入
  secret-key: ${EDGE_SECRET_KEY:}
  # 签名时间戳容差（秒）
  timestamp-tolerance-seconds: ${API_KEY_TIMESTAMP_TOLERANCE:300}