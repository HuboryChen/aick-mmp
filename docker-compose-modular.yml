version: '3.8'

services:
  # Infrastructure Services
  mysql:
    image: mysql:8.0
    container_name: aick-mmp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aick_mmp
      MYSQL_USER: aickuser
      MYSQL_PASSWORD: aickpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aick-mmp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:6.2-alpine
    container_name: aick-mmp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aick-mmp-network
    command: redis-server --appendonly yes

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: aick-mmp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aick-mmp-network

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: aick-mmp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - aick-mmp-network

  janus:
    image: canyan/janus-gateway:latest
    container_name: aick-mmp-janus
    ports:
      - "8088:8088"
      - "8089:8089"
      - "10000-10200:10000-10200/udp"
    volumes:
      - ./janus:/opt/janus/etc/janus
    networks:
      - aick-mmp-network

  # Central Services (using modular build)
  central-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: central-runtime
    container_name: aick-mmp-central-1
    depends_on:
      - mysql
      - redis
      - kafka
      - janus
    environment:
      SPRING_PROFILES_ACTIVE: central
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aick_mmp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: aickuser
      SPRING_DATASOURCE_PASSWORD: aickpassword
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JANUS_SERVER_URL: http://janus:8088
      JWT_SECRET: aick_mmp_super_secret_jwt_key_2024_central_server
    volumes:
      - central_logs:/app/logs
    networks:
      - aick-mmp-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  central-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: central-runtime
    container_name: aick-mmp-central-2
    depends_on:
      - mysql
      - redis
      - kafka
      - janus
    environment:
      SPRING_PROFILES_ACTIVE: central
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aick_mmp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: aickuser
      SPRING_DATASOURCE_PASSWORD: aickpassword
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JANUS_SERVER_URL: http://janus:8088
      JWT_SECRET: aick_mmp_super_secret_jwt_key_2024_central_server
    volumes:
      - central_logs_2:/app/logs
    networks:
      - aick-mmp-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1G

  # Edge Services (using modular build)
  edge-node-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: edge-runtime
    container_name: aick-mmp-edge-node-1
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: edge
      NODE_ID: node-1
      REGION: region-a
      SERVER_PORT: 8081
      CENTRAL_SERVER_URL: http://central-lb:80
      REGISTRY_SERVER: http://central-lb:80/api/registry
      HEARTBEAT_INTERVAL: 30
      MAX_CONCURRENT_STREAMS: 10
      NETWORK_MONITORING_INTERVAL: 60
      CPU_THRESHOLD: 80.0
      MEMORY_THRESHOLD: 85.0
      BANDWIDTH_THRESHOLD: 80.0
      JWT_SECRET: aick_mmp_super_secret_jwt_key_2024_edge_node
      JWT_EXPIRATION: 86400000
    volumes:
      - edge_node_1_data:/app/data
      - edge_node_1_logs:/app/logs
    networks:
      - aick-mmp-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  edge-node-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: edge-runtime
    container_name: aick-mmp-edge-node-2
    ports:
      - "8082:8081"
    environment:
      SPRING_PROFILES_ACTIVE: edge
      NODE_ID: node-2
      REGION: region-b
      SERVER_PORT: 8081
      CENTRAL_SERVER_URL: http://central-lb:80
      REGISTRY_SERVER: http://central-lb:80/api/registry
      HEARTBEAT_INTERVAL: 30
      MAX_CONCURRENT_STREAMS: 10
      JWT_SECRET: aick_mmp_super_secret_jwt_key_2024_edge_node
      JWT_EXPIRATION: 86400000
    volumes:
      - edge_node_2_data:/app/data
      - edge_node_2_logs:/app/logs
    networks:
      - aick-mmp-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Load Balancers
  central-lb:
    image: nginx:alpine
    container_name: aick-mmp-central-lb
    depends_on:
      - central-1
      - central-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/central-lb.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - aick-mmp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  edge-lb:
    image: nginx:alpine
    container_name: aick-mmp-edge-lb
    depends_on:
      - edge-node-1
      - edge-node-2
    ports:
      - "8083:80"
    volumes:
      - ./nginx/edge-lb.conf:/etc/nginx/nginx.conf
    networks:
      - aick-mmp-network

  # Frontend (unchanged)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aick-mmp-frontend
    depends_on:
      - central-lb
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080/api
    networks:
      - aick-mmp-network

volumes:
  mysql_data:
  redis_data:
  central_logs:
  central_logs_2:
  edge_node_1_data:
  edge_node_1_logs:
  edge_node_2_data:
  edge_node_2_logs:

networks:
  aick-mmp-network:
    driver: bridge