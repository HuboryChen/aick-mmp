# MediaMTX configuration for AICK-MMP project
# RTSP/RTMP/WebRTC media server

# Logging
logLevel: info
logDestinations: ["stdout"]

# Protocols (use new field names)
rtsp: true
rtmp: true
hls: true
webrtc: true

# API (for monitoring)
api: true

# Paths configuration
paths:
  all:
    source: publisher
    # This path accepts any stream name
    
  cam1:
    source: rtsp://admin:admin@192.168.1.100:554/Streaming/Channels/101
    # Example camera stream
    
  obs:
    source: publisher
    # For OBS streaming