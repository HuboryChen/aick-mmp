  # AI Analysis Service
  ai-service:
    build:
      context: ./aick-mmp-ai
      dockerfile: Dockerfile
    container_name: aick-mmp-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      - AI_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AI_MODEL_DIR=/app/models
    volumes:
      - ./aick-mmp-ai/models:/app/models
    depends_on:
      - kafka
    networks:
      - aick-network

  edge-lb:
    image: nginx:alpine
    container_name: aick-mmp-edge-lb
    restart: always
    ports:
      - "8083:80"
    volumes:
      - ./nginx/edge-lb.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - edge-node-1
#      - edge-node-2
