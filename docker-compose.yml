services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: aick-mmp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aick_mmp
      MYSQL_USER: aickuser
      MYSQL_PASSWORD: aickpassword
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - aick-network

  # Redis缓存
  redis:
    image: redis:6.2-alpine
    container_name: aick-mmp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aick-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: aick-mmp-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aick-network

  # Kafka Message Queue
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: aick-mmp-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - aick-network

  # Janus WebRTC Gateway
  janus:
    image: canyan/janus-gateway:latest
    container_name: aick-mmp-janus
    restart: always
    ports:
      - "8088:8088"
      - "8188:8188"
      - "8089:8089"
      - "10000-10200:10000-10200/udp"
    volumes:
      - janus-data:/var/lib/janus
      - ./janus/janus.cfg:/usr/local/etc/janus/janus.jcfg
    environment:
      - JANUS_LOG_LEVEL=5
    networks:
      - aick-network

  # RTSP服务器 - 用于接收OBS推流
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: aick-mmp-rtsp-server
    restart: always
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    networks:
      - aick-network

  # Central Services
  central-1:
    build:
      context: ./backend
      dockerfile: aick-mmp-central/Dockerfile
    container_name: aick-mmp-central-1
    restart: always
    depends_on:
      - mysql
      - redis
      - kafka
      - janus
    environment:
      SPRING_PROFILES_ACTIVE: central
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aick_mmp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: aickuser
      SPRING_DATASOURCE_PASSWORD: aickpassword
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JANUS_SERVER_URL: http://janus:8088/janus
      JWT_SECRET: mmp-secret-key-change-in-production-environment-which-is-very-long-and-secure
    volumes:
      - central-1-data:/app/data
      - ./backend/logs/central-1:/app/logs
    networks:
      - aick-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

