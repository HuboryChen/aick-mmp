  central-lb:
    image: nginx:alpine
    container_name: aick-mmp-central-lb
    restart: always
    ports:
      - "8090:80"
    volumes:
      - ./nginx/central-lb.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - central-1
#      - central-2
    networks:
      - aick-network

  # 前端Web应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aick-mmp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - central-lb
    networks:
      - aick-network

  edge-node-1:
    build:
      context: ./backend
      dockerfile: aick-mmp-edge/Dockerfile
    container_name: aick-mmp-edge-node-1
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: edge
      NODE_ID: node-1
      REGION: region-a
      SERVER_PORT: 8080
      CENTRAL_SERVER_URL: http://central-lb
      REGISTRY_SERVER: http://central-lb
      HEARTBEAT_INTERVAL: 30
      JWT_SECRET: mmp-secret-key-change-in-production-environment-which-is-very-long-and-secure
      # AK/SK for auto-registration with central service
      EDGE_ACCESS_KEY: ak_lqnJHPudrUAmujwRQHHbXe4QpqfSPRYnEv5bjBo_TIQ
      EDGE_SECRET_KEY: sk_8iFvm7LCN6Ukb_xb3lr4AmXZaQD31T_rwHJcIzg9Ni0
    volumes:
      - edge-node-1-data:/app/data
      - ./backend/logs/edge-1:/app/logs
    depends_on:
      - redis
    networks:
      - aick-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

